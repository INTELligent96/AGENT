llm_profiles:
  local_coder:
    type: openai_compat
    base_url: http://localhost:1235/v1
    api_key: lm-studio
    model_name: qwen-qwen2.5-coder-14b-instruct
    is_local: true
  local_logic:
    type: openai_compat
    base_url: http://localhost:1235/v1
    api_key: lm-studio
    model_name: deepseek-r1-0528-qwen3-8b-abliterated
    is_local: true
  local_fast:
    type: openai_compat
    base_url: http://localhost:1235/v1
    api_key: lm-studio
    model_name: qwen2.5-7b-instruct-uncensored
    is_local: true
  manual_bridge:
    type: manual_bridge
routing:
  default_model: local_fast
  code_generation: local_coder
  complex_reasoning: local_logic
tools:
  tesseract_path: K:/Program Files/Tesseract-OCR/tesseract.exe
  use_ms_office: true
safety:
  read_only_originals: true
  allowed_paths:
  - D:/DEEPSEEK/AGENT/
  workspace_dir: workspace
agent_loop:
  max_iterations: 10
  task_timeout_seconds: 600
  code_execution_timeout: 15
  max_tokens_default: 4096
  retry_attempts: 2
  retry_delay_seconds: 2
rag:
  db_path: chroma_db
  collection_name: documents
  chunk_size: 1000
  chunk_overlap: 200
  embedding_model: paraphrase-multilingual-MiniLM-L12-v2
  separators:
  - '


    '
  - '

    '
  - '. '
  - '! '
  - '? '
  - ' '
  - ''
self_check:
  enabled: true
  force_always: false
  max_retries: 2
  min_score: 8
  critic_model: local_logic
  default_model_for_check: local_fast
router:
  use_llm_for_ambiguous: true
  dangerous_tools:
  - classify_files
  - batch_summarize
  - index_folder
  - make_file_list
startup:
  check_dependencies: true
  auto_install: false
